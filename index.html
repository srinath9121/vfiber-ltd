<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VF Technologies — Powering a Better Tomorrow</title>
    <meta name="description" content="Venkateswara Fiber Technologies — Utility pole structural analysis, fiber network design, and broadband deployment across Western USA." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050a14;
        font-family: 'Space Grotesk', sans-serif;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Film grain overlay — renders above WebGL canvas, below UI */
      #grain-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0.038;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 256px 256px;
        mix-blend-mode: overlay;
        animation: grainShift 0.08s steps(1) infinite;
      }
      @keyframes grainShift {
        0%   { background-position: 0 0; }
        25%  { background-position: -64px 32px; }
        50%  { background-position: 32px -48px; }
        75%  { background-position: -32px -64px; }
        100% { background-position: 48px 16px; }
      }

      /* Vignette — darkens edges, focuses attention to center */
      #vignette-overlay {
        position: fixed;
        inset: 0;
        z-index: 51;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 40%,
          rgba(0,0,0,0.55) 100%
        );
      }

      /* ── Shared overlay base ── */
      .overlay, #narrative-overlay {
        display: none !important;
        position: fixed;
        pointer-events: none;
        opacity: 0 !important;
        transition: opacity 0.6s ease;
        z-index: 100;
        text-shadow: 0 2px 16px rgba(0,0,0,0.9);
      }
      .overlay.clickable {
        pointer-events: auto;
      }

      /* ── Global Persistent Brand Header (Locked in top-left across all scroll positions) ── */
      .global-brand-header {
        position: fixed;
        top: 2.2rem;
        left: 2.5rem;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 1.15rem;
        pointer-events: auto;
        user-select: none;
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .global-brand-header:hover {
        transform: translateY(-1px);
      }
      .global-brand-header .hero-logo {
        width: clamp(52px, 5vw, 68px);
        height: auto;
        border-radius: 4px;
        display: block;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      }
      .global-brand-header .company {
        font-size: clamp(0.95rem, 2.2vw, 1.35rem);
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .global-brand-header .tagline {
        font-size: clamp(0.72rem, 1.4vw, 0.90rem);
        font-weight: 300;
        color: #00CFFF;
        letter-spacing: 0.12em;
        margin-top: 0.35rem;
        opacity: 0.85;
      }

      /* ── Chapter 1 — USA stats (bottom-left, fades in/out) ── */
      #chapter1-text {
        bottom: 80px;
        left: 60px;
        transition: opacity 0.5s ease;
      }
      #chapter1-text .stat {
        font-size: clamp(1.4rem, 3.5vw, 2rem);
        font-weight: 700;
        color: #ffffff;
        margin: 0;
        line-height: 1.1;
      }
      #chapter1-text .sub {
        font-size: clamp(0.8rem, 1.5vw, 1rem);
        color: rgba(255,255,255,0.7);
        margin: 0.35rem 0 0;
      }
      #chapter1-text .cities {
        font-size: clamp(0.7rem, 1.2vw, 0.85rem);
        color: #00CFFF;
        margin: 0.25rem 0 0;
        letter-spacing: 0.06em;
      }

      /* ── Mobile responsiveness ── */
      @media (max-width: 600px) {
        #chapter0-text {
          top: 2rem;
          left: 1.5rem;
          right: 1.5rem;
        }
        #chapter1-text {
          bottom: 40px;
          left: 20px;
          right: 20px;
        }
        #chapter2-text {
          right: 20px;
          left: 20px;
          padding: 1rem 1.25rem;
        }
        #chapter5-text {
          padding: 1.5rem 1.25rem;
          width: 92%;
        }
        .final-stats-container {
          gap: 24px;
        }
      }

      /* ── Chapter 5 — Final CTA Liquid Glass Panel ── */
      #chapter5-text {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 100;
        opacity: 0;
        transition: opacity 0.8s ease;
        pointer-events: none;
        text-align: center;
        background: rgba(5, 10, 20, 0.65);
        backdrop-filter: blur(16px) saturate(1.4);
        -webkit-backdrop-filter: blur(16px) saturate(1.4);
        border: 1px solid rgba(0, 207, 255, 0.22);
        border-top: 3px solid #00CFFF;
        padding: 2.2rem 3rem;
        border-radius: 4px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        max-width: 580px;
        width: 90%;
      }
      .final-stats-container {
        display: flex;
        gap: 60px;
        justify-content: center;
        margin-bottom: 24px;
      }

      /* ── Chapter 2 — Engineering Telemetry HUD (Sharper, colder, denser data card) ── */
      #chapter2-text {
        top: 35%;
        right: 60px;
        transform: translateY(-50%);
        background: rgba(2, 6, 14, 0.82);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(0, 207, 255, 0.18);
        border-left: 2px solid #00CFFF;
        padding: 1.4rem 1.7rem;
        border-radius: 2px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        max-width: 360px;
        transition: opacity 0.5s ease;
        font-family: 'Space Grotesk', monospace;
      }
      #chapter2-text .hud-badge {
        font-size: 0.68rem;
        color: #00CFFF;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-family: 'Space Grotesk', monospace;
        margin-bottom: 0.5rem;
      }
      #chapter2-text .hud-title {
        font-size: clamp(1.4rem, 2.5vw, 1.8rem);
        font-weight: 700;
        color: #ffffff;
        line-height: 1.15;
        margin: 0 0 1rem;
        font-family: 'Space Grotesk', sans-serif;
      }
      #chapter2-text .hud-specs {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 0.75rem;
        margin-bottom: 0.75rem;
      }
      #chapter2-text .hud-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.75rem;
        font-family: 'Space Grotesk', monospace;
      }
      #chapter2-text .hud-k {
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 0.1em;
      }
      #chapter2-text .hud-v {
        color: #ffffff;
        font-weight: 500;
      }
      #chapter2-text .hud-footnote {
        font-size: 0.78rem;
        color: #C41E3A;
        font-weight: 600;
        letter-spacing: 0.08em;
        margin: 0;
        font-family: 'Space Grotesk', monospace;
        text-transform: uppercase;
      }

      /* ── Chapter 3 — Signal transition (Emotional peak: pure typographic cinema, no box/glass) ── */
      #chapter3-text {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        transition: opacity 0.5s ease;
        white-space: nowrap;
        background: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: none;
        padding: 0;
        box-shadow: none;
      }
      #chapter3-text .signal-label {
        font-size: 0.95rem;
        color: #00CFFF;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin: 0;
        font-family: 'Space Grotesk', monospace;
        opacity: 0.9;
      }
      #chapter3-text .signal-heading {
        font-family: 'Playfair Display', serif;
        font-size: clamp(2rem, 5vw, 3.2rem);
        font-weight: 700;
        color: #ffffff;
        margin: 10px 0 0;
        line-height: 1.15;
        letter-spacing: 0.02em;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.95), 0 0 50px rgba(0, 207, 255, 0.25);
      }

      /* ── Chapter 4 & 6 — Optical & Demarcation HUD (Field documentation: softer cyan, frosted glass) ── */
      #chapter4-text, #chapter6-text {
        bottom: 80px;
        left: 60px;
        transition: opacity 0.5s ease;
        background: rgba(4, 8, 16, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 207, 255, 0.18);
        border-left: 3px solid rgba(0, 207, 255, 0.6);
        border-radius: 2px;
        padding: 1.35rem 1.65rem;
        box-shadow: 0 12px 40px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.06);
        max-width: 440px;
        display: none;
        pointer-events: none;
      }
      #chapter4-text .fiber-label, #chapter6-text .fiber-label {
        font-size: 0.7rem;
        color: #00CFFF;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        margin: 0;
        font-family: 'Space Grotesk', monospace;
      }
      #chapter4-text .fiber-heading, #chapter6-text .fiber-heading {
        font-size: clamp(1.5rem, 3.2vw, 2.0rem);
        font-weight: 700;
        color: #ffffff;
        margin: 0.4rem 0 0.3rem;
        line-height: 1.15;
        font-family: 'Space Grotesk', sans-serif;
      }
      #chapter4-text .fiber-sub, #chapter6-text .fiber-sub {
        font-size: clamp(0.8rem, 1.4vw, 0.95rem);
        color: rgba(255,255,255,0.85);
        margin: 0;
        font-family: 'Space Grotesk', monospace;
      }
      #chapter4-text .fiber-tagline, #chapter6-text .fiber-tagline {
        font-size: 0.82rem;
        color: #C41E3A;
        margin: 0.5rem 0 0;
        letter-spacing: 0.08em;
        font-family: 'Space Grotesk', monospace;
        font-weight: 600;
        text-transform: uppercase;
      }

      /* ── Chapter 5 — Final CTA (centered) ── */
      #overlay-final {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        text-align: center;
        transition: opacity 0.8s ease;
      }
      .final-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.1rem;
      }
      .final-stat span:first-child {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 700;
        color: #ffffff;
        font-family: 'Space Grotesk', monospace;
        line-height: 1;
      }
      .final-label {
        font-size: clamp(0.7rem, 1.5vw, 0.85rem);
        color: #00CFFF;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-family: 'Space Grotesk', monospace;
      }
      .final-hero {
        font-size: clamp(1rem, 2.5vw, 1.4rem);
        font-weight: 500;
        color: rgba(255,255,255,0.8);
        margin-top: 0.5rem;
        letter-spacing: 0.06em;
        font-family: 'Space Grotesk', monospace;
      }
      .cta-button {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.8rem 2.5rem;
        border: 1px solid #C41E3A;
        background: transparent;
        color: #ffffff;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        cursor: pointer;
        transition: background 0.3s ease, transform 0.2s ease;
        pointer-events: auto;
      }
      .cta-button:hover {
        background: #C41E3A;
        transform: translateY(-1px);
      }

      /* ── Phase 20A — Hero Interactive Draw-0 Gate Overlay ── */
      #hero-gate {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #030712;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: crosshair;
      }
      #bg-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 10000;
        pointer-events: none;
      }
      #frost-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 10001;
        pointer-events: none;
      }
      #gesture-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 10002;
        pointer-events: auto;
      }
      #hero-prompt {
        position: absolute;
        z-index: 10005;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
        pointer-events: none;
        text-align: center;
      }
      .prompt-ring {
        width: 72px;
        height: 72px;
        border: 2px dashed rgba(0, 207, 255, 0.45);
        border-radius: 50%;
        animation: pulseRing 3.2s infinite ease-in-out;
      }
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.12); opacity: 0.85; }
      }
      .prompt-text {
        font-family: 'Space Grotesk', monospace;
        font-size: 0.85rem;
        letter-spacing: 0.26em;
        color: #ffffff;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(0, 207, 255, 0.6);
      }
      .prompt-sub {
        font-family: 'Space Grotesk', monospace;
        font-size: 0.65rem;
        letter-spacing: 0.18em;
        color: rgba(0, 207, 255, 0.65);
        text-transform: uppercase;
      }

      /* ── Bottom Chapter Scrubber Bar ── */
      #chapter-scrubber {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 500;
        display: flex;
        gap: 6px;
        padding: 6px 12px;
        background: rgba(3, 8, 16, 0.75);
        backdrop-filter: blur(16px) saturate(1.4);
        -webkit-backdrop-filter: blur(16px) saturate(1.4);
        border: 1px solid rgba(0, 207, 255, 0.22);
        border-radius: 6px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        pointer-events: auto;
        max-width: 95vw;
        overflow-x: auto;
      }
      .scrub-node {
        background: transparent;
        border: 1px solid transparent;
        color: rgba(255, 255, 255, 0.65);
        font-family: 'Space Grotesk', monospace;
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.25s ease;
      }
      .scrub-node:hover {
        color: #ffffff;
        background: rgba(0, 207, 255, 0.12);
        border-color: rgba(0, 207, 255, 0.35);
      }
      .scrub-node.active {
        color: #00CFFF;
        background: rgba(0, 207, 255, 0.2);
        border-color: #00CFFF;
        box-shadow: 0 0 10px rgba(0, 207, 255, 0.3);
        font-weight: 700;
      }

      /* ── ODF Port Inspection Modal / Card ── */
      #odf-port-card {
        position: fixed;
        top: 80px;
        right: 40px;
        width: 320px;
        z-index: 600;
        background: rgba(5, 12, 24, 0.85);
        backdrop-filter: blur(20px) saturate(1.5);
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        border: 1px solid rgba(0, 207, 255, 0.35);
        border-left: 3px solid #00CFFF;
        border-radius: 4px;
        padding: 16px 20px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        display: none;
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: auto;
      }
      #odf-card-close {
        position: absolute;
        top: 10px;
        right: 12px;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        font-size: 14px;
      }
      #odf-card-close:hover {
        color: #ffffff;
      }

      /* ── Mobile Version Adjustments (max-width: 600px) ── */
      @media (max-width: 600px) {
        .global-brand-header {
          top: 1.25rem;
          left: 1.25rem;
          gap: 0.75rem;
        }
        .global-brand-header .hero-logo {
          width: 44px;
        }
        .global-brand-header .company {
          font-size: 0.95rem;
          letter-spacing: 0.12em;
        }
        .global-brand-header .tagline {
          font-size: 0.70rem;
        }

        /* Part 2 — Scrubber nav for narrow screens */
        #chapter-scrubber {
          bottom: 10px;
          padding: 4px 8px;
          gap: 3px;
          max-width: 100vw;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
        }
        #chapter-scrubber::-webkit-scrollbar {
          display: none;
        }
        .scrub-node {
          font-size: 0.55rem;
          padding: 4px 8px;
          letter-spacing: 0.06em;
          white-space: nowrap;
          flex-shrink: 0;
        }

        /* Part 3 — Missing chapter HUD overrides */
        /* Chapter 3 — cinematic heading: reduce font on narrow screens */
        #chapter3-text .signal-heading {
          font-size: clamp(1.4rem, 7vw, 2.2rem);
          white-space: normal;   /* Remove white-space: nowrap; it clips on mobile */
          text-align: center;
        }
        #chapter3-text .signal-label {
          font-size: 0.75rem;
          letter-spacing: 0.18em;
        }

        /* Chapter 4 & 6 — bottom-left HUD: stack closer to edge on narrow screens */
        #chapter4-text, #chapter6-text {
          bottom: 60px;    /* Lift above scrubber */
          left: 16px;
          right: 16px;
          max-width: none;
        }

        /* Chapter 2 — right-side HUD: collapse to bottom on portrait */
        #chapter2-text {
          top: auto;
          bottom: 60px;
          right: 16px;
          left: 16px;
          transform: none;
          max-width: none;
        }

        /* ODF port card: full-width on mobile */
        #odf-port-card {
          top: auto;
          bottom: 70px;
          right: 10px;
          left: 10px;
          width: auto;
        }
      }

      /* ── Ephemeral Scroll Navigation Guide ── */
      #scroll-nav-guide {
        position: fixed;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 150;
        display: flex;
        align-items: center;
        gap: 16px;
        background: rgba(3, 8, 18, 0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 207, 255, 0.35);
        border-radius: 30px;
        padding: 10px 24px 10px 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75), 0 0 25px rgba(0, 207, 255, 0.18);
        font-family: 'Space Grotesk', monospace;
        color: #ffffff;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1), transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        animation: navGuideFloat 3s ease-in-out infinite alternate;
      }
      #scroll-nav-guide.dismissed {
        opacity: 0;
        transform: translate(-50%, 14px);
        pointer-events: none;
      }
      @keyframes navGuideFloat {
        0% { transform: translate(-50%, 0); }
        100% { transform: translate(-50%, -4px); }
      }
      .nav-guide-icon svg {
        display: block;
      }
      .wheel-anim {
        animation: scrollWheelPulse 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes scrollWheelPulse {
        0% { transform: translateY(0); opacity: 1; }
        60% { transform: translateY(7px); opacity: 0; }
        61% { transform: translateY(-2px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      .nav-guide-content {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
      }
      .nav-guide-label {
        font-size: 0.64rem;
        color: #00CFFF;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-weight: 600;
      }
      .nav-guide-title {
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #ffffff;
        white-space: nowrap;
      }
      .nav-guide-sub {
        font-size: 0.72rem;
        color: rgba(255, 255, 255, 0.65);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      @media (max-width: 600px) {
        #scroll-nav-guide {
          bottom: 74px;
          padding: 8px 18px 8px 14px;
          gap: 12px;
        }
        .nav-guide-title {
          font-size: 0.80rem;
        }
        .nav-guide-sub {
          font-size: 0.66rem;
        }
      }

    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Ephemeral Scroll Navigation Guide (Auto-dismisses in 5-7s) -->
    <div id="scroll-nav-guide">
      <div class="nav-guide-icon">
        <svg width="20" height="28" viewBox="0 0 20 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="18" height="26" rx="9" stroke="#00CFFF" stroke-width="1.5" stroke-opacity="0.8"/>
