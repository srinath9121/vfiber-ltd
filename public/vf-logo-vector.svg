<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Deep Navy to Electric Blue Gradient for V -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1e36" />
      <stop offset="50%" stop-color="#143e6a" />
      <stop offset="100%" stop-color="#0066b3" />
    </linearGradient>

    <!-- Metallic Silver/Chrome Gradient for F -->
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ecf2" />
      <stop offset="50%" stop-color="#a0b0c0" />
      <stop offset="100%" stop-color="#607284" />
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Double Outer Precision Frame -->
  <circle cx="100" cy="100" r="92" fill="#040a14" stroke="#182c44" stroke-width="4" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#00CFFF" stroke-width="1.8" opacity="0.9" />

  <!-- 2. Global Optical Network Grid -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="#00CFFF" stroke-width="1.5" opacity="0.85" />
  <ellipse cx="100" cy="100" rx="74" ry="28" fill="none" stroke="#00CFFF" stroke-width="1.2" opacity="0.65" />
  <ellipse cx="100" cy="100" rx="74" ry="52" fill="none" stroke="#00CFFF" stroke-width="1.2" opacity="0.65" />
  <ellipse cx="100" cy="100" rx="42" ry="74" fill="none" stroke="#00CFFF" stroke-width="1.2" opacity="0.65" />
  <ellipse cx="100" cy="100" rx="20" ry="74" fill="none" stroke="#00CFFF" stroke-width="1.2" opacity="0.65" />

  <!-- 3. Dynamic Transatlantic Orbit Ring -->
  <ellipse cx="100" cy="100" rx="94" ry="26" transform="rotate(-24 100 100)" fill="none" stroke="#00CFFF" stroke-width="2.5" filter="url(#cyanGlow)" />

  <!-- 4. Hero "VF" Structural Monogram -->
  <g transform="translate(0, 0)">
    <!-- V Letterform (Left Blue/Navy Core) -->
    <path d="M 52 56 L 82 56 L 102 126 L 84 126 Z" fill="url(#vGrad)" stroke="#00CFFF" stroke-width="0.8" />
    
    <!-- F Letterform (Right Silver Core with Trailing Beams) -->
    <path d="M 96 56 L 156 56 L 148 72 L 118 72 L 114 88 L 144 88 L 138 102 L 110 102 L 103 126 L 86 126 Z" fill="url(#fGrad)" stroke="#ffffff" stroke-width="0.8" />
  </g>
</svg>
